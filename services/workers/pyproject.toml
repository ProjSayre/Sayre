[project]
name = "sayre-workers"
version = "0.1.0"
description = "Python/FastAPI async worker fleet (ingestion, semantic enrichment, retrieval/RAG)."
authors = [{ name = "Sayre" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "tree-sitter==0.23.*",
  "tree-sitter-language-pack==0.*",
  "langchain==0.3.*",
  "langgraph==0.2.*",
  "boto3==1.35.*",
  "psycopg[binary]==3.2.*",
  "pgvector==0.3.*",
  "anthropic==0.40.*",
  "pydantic==2.9.*",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.group.dev.dependencies]
pytest = "8.*"
pytest-asyncio = "0.24.*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
