[project]
name = "sayre-workers"
version = "0.1.0"
description = "Python/FastAPI async worker fleet (ingestion, semantic enrichment, retrieval/RAG)."
authors = [{ name = "Sayre" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "tree-sitter==0.23.*",
  "tree-sitter-language-pack==0.*",
  "langchain==0.3.*",
  "langgraph==0.2.*",
  "boto3==1.35.*",
  "psycopg[binary]==3.2.*",
  "pgvector==0.3.*",
  "anthropic==0.40.*",
  "pydantic==2.9.*",
  "opentelemetry-api==1.29.*",
  "opentelemetry-sdk==1.29.*",
  "opentelemetry-exporter-prometheus==0.50b0",
  "prometheus-client==0.25.*",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.*"
pytest-asyncio = "0.24.*"
ruff = "0.6.*"
mypy = "1.11.*"
httpx = "0.27.*"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Merged from W0-04 (testpaths) + W0-06 (pythonpath/asyncio) — keep as ONE table,
# duplicate [tool.pytest.ini_options] sections are a TOML parse error.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
