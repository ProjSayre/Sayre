# Local datastore infra for the Codebase Visualizer product (not the marketing site).
# Image tags are pinned exactly per DEPENDENCIES.md — no `latest`.
#
# NOTE (deliberate deviation from the ticket's literal wording): the Postgres image is
# `pgvector/pgvector:pg16`, not plain `postgres:16`. Rationale: the vector store is
# pgvector (docs/architecture.md, docs/migration-triggers.md), which requires the
# `vector` extension; the stock `postgres:16` image does not ship it. See DEPENDENCIES.md
# "Deliberate non-migrations" / infra section for detail.
#
# Credentials are pulled from infra/.env.example (placeholders only) — never committed
# as literal secrets, per .claude/rules/security-multitenancy.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sayre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: sayre-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.24-community
    container_name: sayre-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQS emulator for the Python worker fleet (local-dev only — real AWS SQS in prod).
  # See W0-04 spec / .claude/rules/async-messaging.md. Init script provisions the
  # baseline queues (ingestion/enrichment/graph-events/w0-04-selftest) on startup.
  localstack:
    image: localstack/localstack:3.8
    container_name: sayre-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scrapes the /metrics endpoint started by sayre_workers/telemetry/otel.py
  # on the HOST (not a container) -- see infra/prometheus/prometheus.yml.
  # W0-06: vector-store concurrency/latency instrumentation demo.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sayre-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # host reachability on Linux; Docker Desktop resolves it natively

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
