# Runtime-only wiring. Procedures live in .sdd/stages/*.md.
version: 2

stages:
  planner:
    neutral: stages/planner.md
    claude:
      name: planner
      description: >-
        Creates one concise run-scoped spec draft and submits it to the pipeline control plane.
        Use before implementation; never edits product code.
      tools: [Read, Grep, Glob, Write, Bash]
      model: sonnet

  red:
    neutral: stages/red.md
    claude:
      name: red
      description: >-
        Maps test-classified requirements to new or existing behavioral tests before development,
        records hashes and argv-safe commands, and submits one run-scoped draft.
      tools: [Read, Write, Edit, Grep, Glob, Bash]
      model: sonnet

  dev:
    neutral: stages/dev.md
    claude:
      name: dev
      description: >-
        Implements the current run-scoped spec or routed findings, performs focused iteration, and
        records the minimal final verification plan.
      tools: [Read, Write, Edit, Grep, Glob, Bash, Agent]
      model: sonnet

  review:
    neutral: stages/review.md
    claude:
      name: review
      description: >-
        Read-only source reviewer for a deterministically verified run. Returns PASS or actionable
        NEEDS_FIXES through one validated draft.
      tools: [Read, Grep, Glob, Bash, Write]
      disallowedTools: [Edit]
      model: sonnet

  security:
    neutral: stages/security.md
    claude:
      name: security-checker
      description: >-
        Risk-tiered final security gate. FAST checks the diff and selected boundaries; FULL and
        MILESTONE use the separate deep-audit contract.
      tools: [Read, Grep, Glob, Bash, Write]
      disallowedTools: [Edit]
      model: sonnet

  pr-review:
    neutral: stages/pr-review.md
    claude:
      name: pr-review
      description: >-
        Reviews an open pull request across bounds, red-test integrity, spec conformance, tests,
        architecture, limitations, and security. Runs outside the per-ticket pipeline.
      tools: [Read, Grep, Glob, Bash, Write]
      disallowedTools: [Edit]
      model: sonnet
