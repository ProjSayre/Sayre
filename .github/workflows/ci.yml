name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: web + core (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Built-in-only pre-install boundary: these scripts use Node core modules
      # and Git, so no package lifecycle code runs before the source audit.
      - name: Secret-access boundary
        run: npm run check:secret-access && npm run test:secret-access

      # Single root-level install — resolves the marketing site + apps/web +
      # services/core + packages/shared-types together via the workspace
      # lockfile. Shared by both the web and core steps below (not repeated).
      - name: Install dependencies (root, single pass)
        run: npm ci

      - name: config — typecheck
        run: npm run typecheck --workspace @sayre/config

      - name: config — test
        run: npm test --workspace @sayre/config

      - name: web — lint
        run: npx turbo run lint --filter=@sayre/web

      - name: web — typecheck
        run: npx turbo run typecheck --filter=@sayre/web

      - name: web — test
        run: npx turbo run test --filter=@sayre/web

      # turbo's dependency graph (`build`'s `dependsOn: ["^build"]`) builds
      # @sayre/shared-types before @sayre/core automatically — no manual
      # pre-build step needed.
      - name: core — lint
        run: npx turbo run lint --filter=@sayre/core

      - name: core — typecheck
        run: npx turbo run typecheck --filter=@sayre/core

      - name: core — test
        run: npx turbo run test --filter=@sayre/core

  workers:
    name: workers (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.2.0

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Typecheck (mypy)
        run: >-
          poetry run mypy --explicit-package-bases
          app
          sayre_workers/config
          sayre_workers/graph_schema
          messaging/sqs_client.py
          sayre_workers/graph_migrations/runner.py
          scripts/run_graph_migrations.py
          sayre_workers/telemetry/otel.py

      - name: Test (pytest)
        run: poetry run pytest

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [node, workers]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Docker preflight
        run: |
          docker version
          docker compose version

      - name: Build and start local stack
        run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 300

      - name: Verify application health payloads
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            ['http://localhost:3000/api/health', 'web'],
            ['http://localhost:4000/health', 'core'],
            ['http://localhost:8000/health', 'workers'],
          ];

          for (const [url, service] of endpoints) {
            const response = await fetch(url);
            const body = await response.json();
            if (!response.ok || body.status !== 'ok' || body.service !== service) {
              throw new Error(`${service} health check failed: ${response.status} ${JSON.stringify(body)}`);
            }
          }
          NODE

      - name: Compose diagnostics
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps --all
          docker compose -f infra/docker-compose.yml logs --no-color

      - name: Clean up local stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans
