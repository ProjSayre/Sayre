name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: web + core (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16   # plain postgres:16 lacks the `vector` ext code_embeddings needs
        env:
          POSTGRES_USER: sayre_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: sayre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayre_dev -d sayre_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Built-in-only pre-install boundary: these scripts use Node core modules
      # and Git, so no package lifecycle code runs before the source audit.
      - name: Secret-access boundary
        run: npm run check:secret-access && npm run test:secret-access

      # Single root-level install — resolves the marketing site + apps/web +
      # services/core + packages/shared-types together via the workspace
      # lockfile. Shared by both the web and core steps below (not repeated).
      - name: Install dependencies (root, single pass)
        run: npm ci

      - name: config — typecheck
        run: npm run typecheck --workspace @sayre/config

      - name: config — test
        run: npm test --workspace @sayre/config

      - name: web — lint
        run: npx turbo run lint --filter=@sayre/web

      - name: web — typecheck
        run: npx turbo run typecheck --filter=@sayre/web

      - name: web — test
        run: npx turbo run test --filter=@sayre/web

      # turbo's dependency graph (`typecheck`/`test` depend on `^build`) builds
      # @sayre/shared-types before @sayre/core on a clean runner.
      - name: core — lint
        run: npx turbo run lint --filter=@sayre/core

      - name: core — typecheck
        run: npx turbo run typecheck --filter=@sayre/core

      - name: core — test
        run: npx turbo run test --filter=@sayre/core

      - name: core messaging — Redis required (zero broker skips)
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          npm test --workspace @sayre/core --
          --run src/queue/__tests__/bullmq.roundtrip.test.ts

      - name: core — RLS isolation tests (dev suite)
        run: npm --prefix services/core run test:rls:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: core — RLS acceptance tests (tester suite)
        run: npm --prefix services/core run test:rls:acceptance:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

  workers:
    name: workers (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Start LocalStack SQS/SNS topology
        working-directory: ${{ github.workspace }}
        run: >-
          docker compose --env-file infra/.env.example
          -f infra/docker-compose.yml up -d --wait localstack

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Typecheck (mypy)
        run: >-
          poetry run mypy --explicit-package-bases
          app
          sayre_workers/config
          messaging/envelope.py
          messaging/idempotency.py
          messaging/sns_client.py
          messaging/sqs_client.py
          sayre_workers/graph_migrations/runner.py
          scripts/run_graph_migrations.py
          sayre_workers/telemetry/otel.py

      - name: Test (pytest)
        run: poetry run pytest

      - name: Messaging integration — LocalStack required (zero broker skips)
        env:
          SAYRE_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: localstack-test
          AWS_SECRET_ACCESS_KEY: localstack-test
          SQS_ENDPOINT_URL: http://localhost:4566
          SNS_ENDPOINT_URL: http://localhost:4566
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          poetry run pytest
          tests/test_messaging_topology.py
          tests/test_sqs_roundtrip.py
          -q --junitxml=.messaging-junit.xml

      - name: Assert no Python broker tests skipped
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('.messaging-junit.xml').getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in
          ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} broker tests skipped'"

      - name: LocalStack logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml logs localstack

      - name: Stop LocalStack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
