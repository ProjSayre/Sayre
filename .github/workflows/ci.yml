name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: web + core (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16   # plain postgres:16 lacks the `vector` ext code_embeddings needs
        env:
          POSTGRES_USER: sayre_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: sayre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayre_dev -d sayre_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # scripts/sdd-completeness.test.mjs's ledger tests run `git show`
          # against old commits (e.g. e3134fe, several commits back) — a
          # shallow clone (actions/checkout's default fetch-depth: 1) makes
          # those "fatal: bad object", so full history is required here.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Built-in-only pre-install boundary: these scripts use Node core modules
      # and Git, so no package lifecycle code runs before the source audit.
      - name: Secret-access boundary
        run: >-
          npm run check:secret-access && npm run test:secret-access &&
          npm run check:org-secret-access && npm run test:org-secret-access

      # Single root-level install — resolves the marketing site + apps/web +
      # services/core + packages/shared-types together via the workspace
      # lockfile. Shared by both the web and core steps below (not repeated).
      - name: Install dependencies (root, single pass)
        run: npm ci

      # PL-15: the marketing site moved from the repo root into apps/site/. Until now nothing in
      # this repo ever built it — the only signal was Cloudflare Pages' own check on the PR, which
      # is the wrong place to first learn a restructure broke the site. `npm run build --workspace`
      # rather than a turbo filter, so this runs the site's real `tsc --noEmit && vite build`
      # without depending on turbo's cache semantics for a package that writes outside itself.
      - name: site — build
        run: npm run build --workspace @sayre/site

      # PL-03a: .claude/agents/*.md is generated from .sdd/runtimes.yml
      # (scripts/generate-agent-shims.mjs). A hand-edited shim must fail here rather than
      # silently drift from .sdd/ again — this is the "hand-edited shim" edge case's CI gate.
      - name: Agent shims — staleness check
        run: npm run check:agent-shims

      # PL-03a: these two suites cover the generator's --check/dirty-tree/missing-neutral-file edge
      # cases and .sdd/'s completeness/content-hash guarantees. None of this was previously gated
      # in CI. (A third suite, scripts/validate-pipeline-only-bash.test.mjs, tested a Bash
      # PreToolUse guard that was deleted in PL-03a loop 3 — a diagnostic run established that
      # frontmatter-declared subagent hooks never fire on this checkout, so the guard was dead code
      # the whole time; see docs/product/Ticket-Backlog-by-Feature-2.md's PL-03g for the real-enforcement follow-up.)
      - name: Agent shims — generator tests
        run: npm run test:agent-shims

      - name: .sdd/ completeness — tests
        run: npm run test:sdd-completeness

      # The Read()/Edit() half of .claude/settings.json's permissions.deny is generated from
      # .agentignore (scripts/generate-secret-denylist.mjs). Same staleness contract as the shims:
      # .agentignore is the runtime-neutral statement of where secrets live, and this gate is what
      # stops it drifting from the deny list that actually enforces it. A drifted list is worse
      # than no list — it reads as coverage that isn't there.
      - name: Secret deny list — staleness check
        run: npm run check:agent-ignore

      - name: Secret deny list — generator tests
        run: npm run test:agent-ignore

      # PL-03c: .sdd/ledger/index.json is generated from every .sdd/ledger/<run-id>/entry.md
      # (scripts/build-ledger-index.mjs), the same staleness-gate contract as the agent shims above
      # — a hand-edit or a forgotten regeneration after adding a ledger entry must fail here.
      - name: Ledger index — staleness check
        run: npm run check:ledger-index

      - name: Ledger index — generator tests
        run: npm run test:ledger-index

      - name: Ledger append — tests
        run: npm run test:ledger-append

      # PL-03c review Critical 3: scripts/check-red-integrity.mjs is the mechanical half of
      # .sdd/stages/review.md's "Red-test integrity" and "Spec trace" checks (rehash red.md's
      # listed files, resolve every @spec marker). Like check:security-audit-run below, only the
      # script's own test suite runs in CI — .pipeline/red.md is gitignored per-run working state, so
      # there is nothing for `check:red-integrity` itself to check against on a CI runner.
      - name: Red-test integrity check — tests
        run: npm run test:red-integrity

      # PL-04 review pass 2 / Critical 2: scripts/validate-security-audit-agents.mjs and
      # scripts/validate-security-audit-run.mjs are the security stage's own mechanical gates
      # (.sdd/stages/security.md:112,125), but neither had a CI step until this fix — and
      # validate-security-audit-agents.mjs had no test suite at all, despite this same round changing
      # it (G1's A4: registry/schema JSON.parse -> parseJsonOrThrow, so a duplicate top-level key in
      # agent-registry.json can no longer silently narrow which security-attacker briefs run). Unlike
      # check:security-audit-run/check:red-integrity (which validate a specific per-run artifact under
      # gitignored .pipeline/ working state, with nothing to check against on a CI runner),
      # validate-security-audit-agents.mjs validates committed, git-tracked static configuration (the
      # attacker-agent registry, its two JSON schemas, the contract/orchestrator/brief files) — nothing
      # per-run or ephemeral — so it runs directly here on every CI invocation, the same way
      # check:agent-shims does.
      - name: Security audit agent registry — static config check
        run: npm run check:security-audit-agents

      - name: Security audit agent registry — tests
        run: npm run test:security-audit-agents

      # CORRECTED (PL-04 review pass 2): the comment above this step previously claimed
      # check:security-audit-run's own test suite already ran in CI ("Like check:security-audit-run,
      # only the script's own test suite runs in CI") — false; there was no step for it anywhere in
      # this file. check:security-audit-run itself still doesn't run here (same reasoning as
      # check:red-integrity above: it validates one specific .pipeline/security-history/<run-id>/ run,
      # gitignored per-run working state with nothing to check against on a CI runner) — only its own
      # test suite does, now for real.
      - name: Security audit run validator (validate-security-audit-run.mjs) — tests
        run: npm run test:security-audit-run

      # PL-03h round 4: scripts/pipeline-contracts.mjs is the shared JSON-sidecar contract
      # build-ledger-index.mjs/check-red-integrity.mjs/ledger-append.mjs now read for every control
      # decision (spec.json/red.json/changes.json/review.json/security.json), replacing the markdown
      # block scanner those three suites above used to exercise directly. Its own strict-validation
      # suite runs here, independent of whether any real .pipeline/*.json exists on this runner.
      - name: Pipeline JSON-sidecar contract — tests
        run: npm run test:pipeline-contracts

      # PL-04 review pass 1 / Blocker 1 (C1): buildStamp/stampFreshness (exercised above by
      # test:pipeline-contracts) had zero non-test callers — every stage's own "Exact shape" output
      # contract promised a `stamp` field nothing ever wrote, so `security`'s "refuse on a stale
      # review.json" promise could never fire. scripts/write-stamp.mjs (the producer) and
      # scripts/check-stamp-freshness.mjs (the consumer every stage's "Staleness of required inputs"
      # section now names by exact command/exit code) close that gap. Gated here the same way every
      # other control-plane script's own suite already is — a script this round adds without a CI
      # step is the same "documented but unwired" defect class this whole pass exists to eliminate.
      - name: Stamp producer (write-stamp.mjs) — tests
        run: npm run test:write-stamp

      - name: Stamp freshness check (check-stamp-freshness.mjs) — tests
        run: npm run test:stamp-freshness

      # PL-03d: the lane-bounds verdict is computed by a script rather than judged by pr-review,
      # so an LLM cannot hallucinate a pass. Its own suite runs here; `check:bounds` needs a lane
      # and a diff base, which are per-PR inputs the pr-review stage supplies.
      - name: Lane bounds check — tests
        run: npm run test:bounds

      # PL-11: the /pipeline-lite lane's own mechanical eligibility gate (max_files/max_changed_lines
      # + the hotfix_barred_paths/deny_for_fenced_lanes union), same "a computer counts, an agent
      # doesn't judge" reasoning as the lane-bounds check above. Its own suite runs here the same way;
      # `check:lite-eligible` itself needs a live working tree or --files/--base, which are per-run
      # inputs ledger-append.mjs --lite (or a human) supplies.
      - name: Lite-lane eligibility check — tests
        run: npm run test:lite-eligible

      # PL-03g: this guard is what actually makes review/security-checker read-only, wired as a
      # PreToolUse hook in .claude/settings.json. It matters that CI runs this suite: a hook that
      # fails to load exits 1, and a PreToolUse hook only BLOCKS on exit 2 — so a broken guard
      # silently enforces nothing, which is indistinguishable from having no guard at all. That is
      # the exact failure this control was built to end, so it is not left to inspection.
      - name: Checker read-only guard — tests
        run: npm run test:readonly-guard

      # W0-00's two suites, brought over unwired by PR #78 (main's older sdd-completeness
      # didn't require wiring; this branch's PL-11-era assertion does — PL-14).
      # dependency-install re-runs `npm ci` at the repo root (clean-state by design); its
      # Poetry half self-skips on this runner (no poetry on PATH) — see PL-14 spec EC-5.
      - name: Dependency baseline — tests
        run: npm run test:dependency-baseline

      - name: Dependency install — tests
        run: npm run test:dependency-install

      # PL-15: the repo-restructure's own red-authored behavioral suite — the moves stayed
      # byte-identical, the deploy shims hold, the reference sweep is clean, and the surfaces the
      # ticket promised not to touch stayed untouched.
      - name: Repo structure — tests
        run: npm run test:repo-structure

      # PL-04 / item 4: the root tsconfig.json's "include" is ["src"] only, so `npx tsc --noEmit`
      # (the config — typecheck / web — typecheck / core — typecheck steps below) has never checked
      # anything under scripts/ — every "tsc clean" this pipeline tooling reported was vacuous for
      # it. scripts/tsconfig.json adds `checkJs` over the SDD pipeline control-plane scripts and
      # their test suites specifically (see that file's own header for exactly which files, and why
      # the marketing-site/secret-scanning scripts elsewhere in scripts/ are deliberately out of
      # scope for this pass).
      - name: Pipeline control-plane scripts — typecheck
        run: npm run typecheck:scripts

      - name: config — typecheck
        run: npm run typecheck --workspace @sayre/config

      - name: config — test
        run: npm test --workspace @sayre/config

      - name: web — lint
        run: npx turbo run lint --filter=@sayre/web

      - name: web — typecheck
        run: npx turbo run typecheck --filter=@sayre/web

      - name: web — test
        run: npx turbo run test --filter=@sayre/web

      # @sayre/gateway had no lint/typecheck/test CI coverage despite being a
      # real workspace member with its own test suite (WebSocket gateway +
      # Redis pub/sub + SQS consumer) — added so a regression here doesn't
      # ship silently. No external services needed: its tests mock
      # Redis/SQS rather than requiring the live redis: service below.
      - name: gateway — lint
        run: npx turbo run lint --filter=@sayre/gateway

      - name: gateway — typecheck
        run: npx turbo run typecheck --filter=@sayre/gateway

      - name: gateway — test
        run: npx turbo run test --filter=@sayre/gateway

      # turbo's dependency graph (`typecheck`/`test` depend on `^build`) builds
      # @sayre/shared-types before @sayre/core on a clean runner.
      - name: core — lint
        run: npx turbo run lint --filter=@sayre/core

      - name: core — typecheck
        run: npx turbo run typecheck --filter=@sayre/core

      # tenantIsolation.penetration.test.ts (services/core/src/security/**) lives
      # outside vitest.config.ts's `src/db/**` exclude, so it runs as part of the
      # normal `turbo run test` suite, not a dedicated :ci script like the two RLS
      # steps below. Its Postgres-gated section (W2-06 AC-2) needs the same
      # DATABASE_ADMIN_URL the RLS steps use, or it silently skips instead of
      # actually proving the "filter removed" isolation guarantee.
      - name: core — test
        # Run the workspace test command directly so DATABASE_ADMIN_URL reaches
        # Vitest. Turbo's strict env mode strips undeclared variables, which
        # would make the penetration suite silently take its reachability skip.
        run: npm run test --workspace @sayre/core
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      # W0-04 (GAP-3a/GAP-5): bullmq.priority.test.ts joins the existing round-trip file
      # in this step's zero-skip gate. Both files assert exact live-queue counts on the
      # shared `github-sync` BullMQ queue, so they must run in the same vitest
      # invocation with vitest.config.ts's `fileParallelism: false` in effect — not as
      # two separate `npm test` invocations racing each other for the broker.
      - name: core messaging — Redis required (zero broker skips)
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          npm test --workspace @sayre/core --
          --run src/queue/__tests__/bullmq.roundtrip.test.ts
          src/queue/__tests__/bullmq.priority.test.ts

      - name: core — RLS isolation tests (dev suite)
        run: npm --prefix services/core run test:rls:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: core — RLS acceptance tests (tester suite)
        run: npm --prefix services/core run test:rls:acceptance:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      # W3-10 Jira connection RLS test (jiraConnectionStore.rls.test.ts) — same
      # node:test-vs-vitest reason as the two steps above, but this one had no
      # :ci script at all until now, so it never ran anywhere.
      - name: core — RLS isolation tests (Jira connections)
        run: npm --prefix services/core run test:rls:jira:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      # test/mcp-interop/interop.test.ts (MCP tool-handler contract against a
      # fixture gateway + fake OpenAI-compatible model) has its own tsconfig
      # covered by `core — typecheck` above, but execution was never wired in
      # — only its typecheck ran, not the tests themselves.
      - name: core — MCP interop tests
        run: npm run test:mcp-interop --workspace @sayre/core

  workers:
    name: workers (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    services:
      # Same image/shape as the `node` job's Postgres service (pgvector build,
      # same throwaway sayre_dev credentials) -- test_tenant_isolation.py (W2-06)
      # needs a real, migrated Postgres to prove the "privileged-DSN trap"
      # (org_scoped_connection still isolates under a superuser/BYPASSRLS DSN),
      # otherwise it silently skips forever, same gap the Node side had.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sayre_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: sayre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayre_dev -d sayre_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
      # W0-02 audit finding A: the migration-runner's real-infra tests
      # (test_graph_migrations.py / test_graph_migrations_audit.py) need a real Neo4j
      # to prove the ticket's literal acceptance line ("migrations run twice produce
      # no duplicate nodes/constraints") against actual Cypher execution, not just the
      # fake-driver tier that can't tell MERGE from CREATE. Without this service,
      # `_neo4j_reachable()` is False on every CI run and those tests silently skip
      # forever -- see the zero-skip gate step below, which is the other half of the
      # fix.
      neo4j:
        image: neo4j:5.24-community
        env:
          NEO4J_AUTH: neo4j/changeme_local_only
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Start LocalStack SQS/SNS topology
        working-directory: ${{ github.workspace }}
        run: >-
          docker compose --env-file infra/.env.example
          -f infra/docker-compose.yml up -d --wait localstack

      # The Postgres schema (RLS policies, sayre_app role, pgvector extension)
      # is Node/drizzle-owned (services/core/drizzle/**) -- the Python worker
      # fleet has no migration runner of its own (docs/tenant-isolation.md).
      # Apply it here, against this job's own Postgres service, before pytest
      # runs, exactly the same migrate() call the Node RLS/pen-test suites
      # apply against theirs.
      - name: Setup Node (for schema migration only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (root, for services/core's migrator)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Migrate Postgres schema (RLS + sayre_app role + pgvector) onto this job's DB
        working-directory: ${{ github.workspace }}
        run: npm --prefix services/core run db:migrate:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Typecheck (mypy)
        run: >-
          poetry run mypy --explicit-package-bases
          app
          sayre_workers/config
          messaging/envelope.py
          messaging/idempotency.py
          messaging/sns_client.py
          messaging/sqs_client.py
          sayre_workers/graph_migrations/runner.py
          scripts/run_graph_migrations.py
          sayre_workers/telemetry
          sayre_workers/db
          sayre_workers/ingestion
          sayre_workers/model_provider
          sayre_workers/enrichment
          sayre_workers/retrieval
          sayre_workers/tickets
          sayre_workers/parsing
          sayre_workers/dynamic_coverage
          sayre_workers/cli.py
          sayre_workers/__main__.py

      # DATABASE_ADMIN_URL lets test_tenant_isolation.py's Postgres-gated suite
      # actually execute here instead of skipping (mirrors the `core — RLS`
      # steps' env in the node job). DATABASE_RUNTIME_URL is set to the same
      # DSN for parity with infra/.env.example's two-variable contract; no
      # current pytest file drives assert_runtime_role_rls_safe's CI-gated
      # path against a real DB (test_db_session.py covers that logic against
      # fakes), but wiring it now avoids a second silent-skip gap if that
      # coverage is added later. NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD (W0-02 audit
      # finding A) let the graph-migration real-infra tests run here too, matching
      # the `neo4j` service above -- the dedicated zero-skip gate below is what
      # actually enforces they ran rather than skipped.
      - name: Test (pytest)
        run: poetry run pytest
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev
          DATABASE_RUNTIME_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: changeme_local_only

      # W0-02 audit finding A: re-run the graph-migration test files explicitly (not
      # just as part of the full suite above) with a junit report, so the zero-skip
      # gate immediately below has something to inspect. Covers *every*
      # tests/test_graph_migrations*.py file -- a gate that missed one would let its
      # real-infra tests skip in CI unnoticed, which is finding A moved rather than
      # fixed.
      - name: Graph-migration integration — Neo4j required (zero skips)
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev
          DATABASE_RUNTIME_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: changeme_local_only
        run: >-
          poetry run pytest
          tests/test_graph_migrations.py
          tests/test_graph_migrations_audit.py
          -q --junitxml=.graph-migrations-junit.xml

      - name: Assert no graph-migration tests skipped
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('.graph-migrations-junit.xml').getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in
          ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} graph-migration tests skipped'"

      - name: Messaging integration — LocalStack required (zero broker skips)
        env:
          SAYRE_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: localstack-test
          AWS_SECRET_ACCESS_KEY: localstack-test
          SQS_ENDPOINT_URL: http://localhost:4566
          SNS_ENDPOINT_URL: http://localhost:4566
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          poetry run pytest
          tests/test_messaging_topology.py
          tests/test_sqs_roundtrip.py
          -q --junitxml=.messaging-junit.xml

      - name: Assert no Python broker tests skipped
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('.messaging-junit.xml').getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in
          ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} broker tests skipped'"

      # W0-04 (GAP-4/GAP-4a): genuine cross-language, live-broker round-trip in both
      # directions (Node -> Python over ingestion.fifo, Python -> Node over the
      # graph-updated SNS topic / graph-updated-realtime SQS queue), driving the real
      # production entry points on both sides via the two tsx harnesses under
      # services/core/test/cross-runtime/ and services/gateway/test/cross-runtime/.
      # LocalStack, Node 20, and a root `npm ci` are already set up earlier in this job
      # (see the "Start LocalStack SQS/SNS topology" and "Install Node dependencies"
      # steps above) — no new service or toolchain is added here.
      - name: Cross-runtime round-trip — LocalStack + Node required (zero skips)
        env:
          SAYRE_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: localstack-test
          AWS_SECRET_ACCESS_KEY: localstack-test
          SQS_ENDPOINT_URL: http://localhost:4566
          SNS_ENDPOINT_URL: http://localhost:4566
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          poetry run pytest
          tests/test_cross_runtime_roundtrip.py
          -q --junitxml=.cross-runtime-junit.xml

      - name: Assert no cross-runtime tests skipped
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('.cross-runtime-junit.xml').getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in
          ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} cross-runtime tests skipped'"

      - name: LocalStack logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml logs localstack

      - name: Stop LocalStack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
