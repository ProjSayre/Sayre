name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: web + core (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16   # plain postgres:16 lacks the `vector` ext code_embeddings needs
        env:
          POSTGRES_USER: sayre_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: sayre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayre_dev -d sayre_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Built-in-only pre-install boundary: these scripts use Node core modules
      # and Git, so no package lifecycle code runs before the source audit.
      - name: Secret-access boundary
        run: >-
          npm run check:secret-access && npm run test:secret-access &&
          npm run check:org-secret-access && npm run test:org-secret-access

      # Single root-level install — resolves the marketing site + apps/web +
      # services/core + packages/shared-types together via the workspace
      # lockfile. Shared by both the web and core steps below (not repeated).
      - name: Install dependencies (root, single pass)
        run: npm ci

      # PL-03a: .claude/agents/*.md is generated from .sdd/runtimes.yml
      # (scripts/generate-agent-shims.mjs). A hand-edited shim must fail here rather than
      # silently drift from .sdd/ again — this is the "hand-edited shim" edge case's CI gate.
      - name: Agent shims — staleness check
        run: npm run check:agent-shims

      # PL-03a: these two suites cover the generator's --check/dirty-tree/missing-neutral-file edge
      # cases and .sdd/'s completeness/content-hash guarantees. None of this was previously gated
      # in CI. (A third suite, scripts/validate-pipeline-only-bash.test.mjs, tested a Bash
      # PreToolUse guard that was deleted in PL-03a loop 3 — a diagnostic run established that
      # frontmatter-declared subagent hooks never fire on this checkout, so the guard was dead code
      # the whole time; see docs/PRD_Tickets.md's PL-03g for the real-enforcement follow-up.)
      - name: Agent shims — generator tests
        run: npm run test:agent-shims

      - name: .sdd/ completeness — tests
        run: npm run test:sdd-completeness

      # PL-03c: .sdd/ledger/index.json is generated from every .sdd/ledger/<run-id>/entry.md
      # (scripts/build-ledger-index.mjs), the same staleness-gate contract as the agent shims above
      # — a hand-edit or a forgotten regeneration after adding a ledger entry must fail here.
      - name: Ledger index — staleness check
        run: npm run check:ledger-index

      - name: Ledger index — generator tests
        run: npm run test:ledger-index

      - name: Ledger append — tests
        run: npm run test:ledger-append

      # PL-03c review Critical 3: scripts/check-red-integrity.mjs is the mechanical half of
      # .sdd/stages/review.md's "Red-test integrity" and "Spec trace" checks (rehash red.md's
      # listed files, resolve every @spec marker). Like check:security-audit-run, only the script's
      # own test suite runs in CI — .pipeline/red.md is gitignored per-run working state, so there
      # is nothing for `check:red-integrity` itself to check against on a CI runner.
      - name: Red-test integrity check — tests
        run: npm run test:red-integrity

      - name: config — typecheck
        run: npm run typecheck --workspace @sayre/config

      - name: config — test
        run: npm test --workspace @sayre/config

      - name: web — lint
        run: npx turbo run lint --filter=@sayre/web

      - name: web — typecheck
        run: npx turbo run typecheck --filter=@sayre/web

      - name: web — test
        run: npx turbo run test --filter=@sayre/web

      # turbo's dependency graph (`typecheck`/`test` depend on `^build`) builds
      # @sayre/shared-types before @sayre/core on a clean runner.
      - name: core — lint
        run: npx turbo run lint --filter=@sayre/core

      - name: core — typecheck
        run: npx turbo run typecheck --filter=@sayre/core

      # tenantIsolation.penetration.test.ts (services/core/src/security/**) lives
      # outside vitest.config.ts's `src/db/**` exclude, so it runs as part of the
      # normal `turbo run test` suite, not a dedicated :ci script like the two RLS
      # steps below. Its Postgres-gated section (W2-06 AC-2) needs the same
      # DATABASE_ADMIN_URL the RLS steps use, or it silently skips instead of
      # actually proving the "filter removed" isolation guarantee.
      - name: core — test
        # Run the workspace test command directly so DATABASE_ADMIN_URL reaches
        # Vitest. Turbo's strict env mode strips undeclared variables, which
        # would make the penetration suite silently take its reachability skip.
        run: npm run test --workspace @sayre/core
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: core messaging — Redis required (zero broker skips)
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          npm test --workspace @sayre/core --
          --run src/queue/__tests__/bullmq.roundtrip.test.ts

      - name: core — RLS isolation tests (dev suite)
        run: npm --prefix services/core run test:rls:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: core — RLS acceptance tests (tester suite)
        run: npm --prefix services/core run test:rls:acceptance:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

  workers:
    name: workers (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    services:
      # Same image/shape as the `node` job's Postgres service (pgvector build,
      # same throwaway sayre_dev credentials) -- test_tenant_isolation.py (W2-06)
      # needs a real, migrated Postgres to prove the "privileged-DSN trap"
      # (org_scoped_connection still isolates under a superuser/BYPASSRLS DSN),
      # otherwise it silently skips forever, same gap the Node side had.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sayre_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: sayre_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayre_dev -d sayre_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Start LocalStack SQS/SNS topology
        working-directory: ${{ github.workspace }}
        run: >-
          docker compose --env-file infra/.env.example
          -f infra/docker-compose.yml up -d --wait localstack

      # The Postgres schema (RLS policies, sayre_app role, pgvector extension)
      # is Node/drizzle-owned (services/core/drizzle/**) -- the Python worker
      # fleet has no migration runner of its own (docs/tenant-isolation.md).
      # Apply it here, against this job's own Postgres service, before pytest
      # runs, exactly the same migrate() call the Node RLS/pen-test suites
      # apply against theirs.
      - name: Setup Node (for schema migration only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (root, for services/core's migrator)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Migrate Postgres schema (RLS + sayre_app role + pgvector) onto this job's DB
        working-directory: ${{ github.workspace }}
        run: npm --prefix services/core run db:migrate:ci
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Typecheck (mypy)
        run: >-
          poetry run mypy --explicit-package-bases
          app
          sayre_workers/config
          messaging/envelope.py
          messaging/idempotency.py
          messaging/sns_client.py
          messaging/sqs_client.py
          sayre_workers/graph_migrations/runner.py
          scripts/run_graph_migrations.py
          sayre_workers/telemetry/otel.py
          sayre_workers/db
          sayre_workers/ingestion
          sayre_workers/model_provider
          sayre_workers/enrichment
          sayre_workers/retrieval
          sayre_workers/tickets

      # DATABASE_ADMIN_URL lets test_tenant_isolation.py's Postgres-gated suite
      # actually execute here instead of skipping (mirrors the `core — RLS`
      # steps' env in the node job). DATABASE_RUNTIME_URL is set to the same
      # DSN for parity with infra/.env.example's two-variable contract; no
      # current pytest file drives assert_runtime_role_rls_safe's CI-gated
      # path against a real DB (test_db_session.py covers that logic against
      # fakes), but wiring it now avoids a second silent-skip gap if that
      # coverage is added later.
      - name: Test (pytest)
        run: poetry run pytest
        env:
          DATABASE_ADMIN_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev
          DATABASE_RUNTIME_URL: postgresql://sayre_dev:changeme_local_only@localhost:5432/sayre_dev

      - name: Messaging integration — LocalStack required (zero broker skips)
        env:
          SAYRE_ENV: test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: localstack-test
          AWS_SECRET_ACCESS_KEY: localstack-test
          SQS_ENDPOINT_URL: http://localhost:4566
          SNS_ENDPOINT_URL: http://localhost:4566
          MESSAGING_INTEGRATION_REQUIRED: 'true'
        run: >-
          poetry run pytest
          tests/test_messaging_topology.py
          tests/test_sqs_roundtrip.py
          -q --junitxml=.messaging-junit.xml

      - name: Assert no Python broker tests skipped
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('.messaging-junit.xml').getroot();
          skipped=sum(int(s.attrib.get('skipped', 0)) for s in
          ([root] if root.tag == 'testsuite' else root.findall('testsuite')));
          assert skipped == 0, f'{skipped} broker tests skipped'"

      - name: LocalStack logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml logs localstack

      - name: Stop LocalStack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes

  docker-build:
    name: docker build (web, core, workers)
    runs-on: ubuntu-latest
    # Build-only, no registry auth/push — deploy.yml's build-and-push job does
    # the real push to ECR after this same Dockerfile set. This job exists so
    # a broken Dockerfile is caught on every PR instead of only surfacing at
    # an actual deploy attempt after merging to main.
    strategy:
      matrix:
        include:
          # Same context/dockerfile pairing as deploy.yml's build-and-push
          # matrix — apps/web and services/core need the repo root as build
          # context to see the root lockfile and sibling workspace packages
          # (@sayre/config, @sayre/shared-types); services/workers is
          # Poetry-only and self-contained, so it keeps its own directory.
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: core
            context: .
            dockerfile: services/core/Dockerfile
          - name: workers
            context: services/workers
            dockerfile: services/workers/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
